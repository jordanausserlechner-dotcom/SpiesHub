<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#080908">

<title>SpiesHub | From People Who Know and Use the Gear</title>

<meta name="description" content="SpiesHub — from people who know and use the gear. Explore products, deals, reviews, blog and more.">

<style>

:root {
    --black: #080908;
    --olive: #71845a;
    --olive-light: #8da56f;
    --white: #f1f2ed;
    --border: #272d27;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #080908;
    color: #f1f2ed;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}


/* HEADER */

header {
    background: #080908;
    border-bottom: 1px solid #272d27;
}

.header-inner {
    width: 92%;
    max-width: 1200px;
    min-height: 78px;
    margin: auto;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    color: #f1f2ed;
    text-decoration: none;

    font-size: 27px;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo span {
    color: #8da56f;
}

nav {
    display: flex;
    gap: 28px;
}

nav a {
    color: #f1f2ed;
    text-decoration: none;

    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1px;
}

nav a:hover {
    color: #8da56f;
}


/* HERO */

.hero {
    width: 92%;
    max-width: 1200px;

    min-height: 570px;

    margin: auto;

    display: flex;
    align-items: center;
}

.hero-content {
    max-width: 1000px;
}

.hero h1 {
    color: #f1f2ed;

    font-size: clamp(48px, 8vw, 88px);

    line-height: 1;

    letter-spacing: -4px;

    font-weight: 900;

    margin: 0;
}

.hero h1 span {
    color: #8da56f;
}


/* MAIN LINKS */

.main-links {
    width: 92%;
    max-width: 1200px;

    margin: auto;

    border-top: 1px solid #272d27;
}

.main-link {
    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 28px 0;

    border-bottom: 1px solid #272d27;

    color: #f1f2ed;

    text-decoration: none;

    transition: padding-left .2s ease;
}

.main-link:hover {
    padding-left: 12px;
}

.main-link h2 {
    margin: 0;

    color: #f1f2ed;

    font-size: clamp(28px, 5vw, 48px);

    line-height: 1;

    font-weight: 800;

    letter-spacing: -1px;
}

.main-link h2 span {
    color: #8da56f;
}

.arrow {
    color: #8da56f;

    font-size: 22px;
}


/* MOBILE */

@media (max-width: 750px) {

    nav {
        display: none;
    }

    .header-inner {
        min-height: 70px;
    }

    .hero {
        min-height: 500px;
    }

    .hero h1 {
        font-size: 48px;
        letter-spacing: -3px;
    }

    .main-link {
        padding: 24px 0;
    }

    .main-link h2 {
        font-size: 34px;
    }

}

</style>

</head>


<body>


<header>

    <div class="header-inner">

        <a href="index.html" class="logo">
            Spies<span>Hub</span>
        </a>

        <nav>

            <a href="products.html">PRODUCTS</a>

            <a href="deals.html">DEALS</a>

            <a href="reviews.html">REVIEWS</a>

            <a href="blog.html">BLOG</a>

            <a href="about.html">ABOUT</a>

        </nav>

    </div>

</header>


<main>


<section class="hero">

    <div class="hero-content">

        <h1>

            FROM PEOPLE WHO

            <br>

            <span>KNOW AND USE THE GEAR.</span>

        </h1>

    </div>

</section>


<section class="main-links">


    <a href="products.html" class="main-link">

        <h2>
            PRODUCTS<span>.</span>
        </h2>

        <div class="arrow">→</div>

    </a>


    <a href="deals.html" class="main-link">

        <h2>
            DEALS<span>.</span>
        </h2>

        <div class="arrow">→</div>

    </a>


    <a href="reviews.html" class="main-link">

        <h2>
            REVIEWS<span>.</span>
        </h2>

        <div class="arrow">→</div>

    </a>


    <a href="blog.html" class="main-link">

        <h2>
            BLOG<span>.</span>
        </h2>

        <div class="arrow">→</div>

    </a>


    <a href="about.html" class="main-link">

        <h2>
            ABOUT<span>.</span>
        </h2>

        <div class="arrow">→</div>

    </a>


</section>


</main>


</body>

</html>
